<text x="652.0" y="239.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1" text-anchor="start" xml:space="preserve">generated sequence</text>
<text x="552.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#e6edf3" text-anchor="start" xml:space="preserve">&lt;unit&gt;_unit.c</text>
<text x="652.0" y="258.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1" text-anchor="start" xml:space="preserve">each unit's C</text>
<text x="552.0" y="284.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1" text-anchor="start" xml:space="preserve">the sequence: dr_view, kmx_program</text>
<text x="30.0" y="342.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4493f8" text-anchor="start" xml:space="preserve">implementations ask; the core assigns</text>
<text x="800.0" y="342.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="end" xml:space="preserve">no number written by hand</text>
<text x="30.0" y="370.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#4493f8" text-anchor="start" xml:space="preserve">km.merge</text>
<text x="206.0" y="370.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">handler numbers over the classes; their buffers in one layout</text>
<text x="30.0" y="390.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#4493f8" text-anchor="start" xml:space="preserve">prism.core.fields</text>
<text x="206.0" y="390.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">fields several classes share, each sized by its largest user;</text>
<text x="206.0" y="410.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">command_space: each stage's parts over the same bytes</text>
<text x="30.0" y="430.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#4493f8" text-anchor="start" xml:space="preserve">prism.core.resources</text>
<text x="206.0" y="430.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">the thread's regions, numbers, layer columns, times, results,</text>
<text x="206.0" y="450.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">the commands' numbers (FRAME is 1); refused with the numbers</text>
<text x="30.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#4493f8" text-anchor="start" xml:space="preserve">prism.core.capacity</text>
<text x="206.0" y="470.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" xml:space="preserve">the tiles a load is sized for; a reload past them</text>
<text x="30.0" y="502.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1" text-anchor="start" xml:space="preserve">A slot is passed by its name: a unit gives or takes it on the thread, a host gives it (slots()) or connects to it.</text>
